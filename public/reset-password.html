<!DOCTYPE html>
<html>
<head>
    <title>Reset Password - SCOPS</title>
    <style>
        body { font-family: Arial; max-width: 500px; margin: 50px auto; }
        input { width: 100%; padding: 10px; margin: 10px 0; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
<h2>Reset Your SCOPS Password</h2>
<form id="resetForm">
    <input type="password" id="newPassword" placeholder="New Password (min 8 chars)" required>
    <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
    <button type="submit">Reset Password</button>
    <p id="message"></p>
</form>

<script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const email = params.get('email');

    if (!token || !email) {
        document.getElementById('message').textContent = '❌ Invalid reset link!';
        document.getElementById('resetForm').style.display = 'none';
    }

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const password = document.getElementById('newPassword').value;
        const password_confirmation = document.getElementById('confirmPassword').value;

        if (password !== password_confirmation) {
            document.getElementById('message').textContent = '❌ Passwords do not match!';
            return;
        }

        try {
            const response = await fetch('https://scops-api.onrender.com/api/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email,
                    token,
                    password,
                    password_confirmation
                })
            });

            const data = await response.json();

            if (data.success) {
                document.getElementById('message').textContent = '✅ Password reset successfully! You can now login in SCOPS.';
                document.getElementById('resetForm').style.display = 'none';
            } else {
                document.getElementById('message').textContent = '❌ Error: ' + data.message;
            }
        } catch (error) {
            document.getElementById('message').textContent = '❌ Error: ' + error.message;
        }
    });
</script>
</body>
</html>
